import java.net.URL
import java.nio.file.Files
import java.nio.file.Paths
import java.security.MessageDigest

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }

}

plugins {
    id 'com.android.application'
}

tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.txz")
    String imageFSSHA256Sum = "https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.sha256sum"
    int parts = 4

    doLast {
        if (!imageFS.exists()) {
            println("ImageFS was not present, downloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.txz.%02d", i))
                String partURL = String.format("https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }

        String remoteChecksum = new URL(imageFSSHA256Sum).text.split("\\s+")[0].trim()
        byte[] data = Files.readAllBytes(imageFS.toPath())
        byte[] hash = MessageDigest.getInstance("SHA-256").digest(data)
        String localChecksum = String.format("%064x", new BigInteger(1, hash))

        if (remoteChecksum != localChecksum) {
            println("The version of ImageFS present locally is older than remote or hasn't been downloaded properly, redownloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.txz.%02d", i))
                String partURL = String.format("https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }
    }
}

// Only Proton 10.0-4 x86_64 ships now. The 9.0 pair (x86_64 and arm64ec) and the 10.0-4 arm64ec
// build were dropped, and leaving them here would be worse than dead code: this task recreates
// whatever is missing from assets/, and Gradle packs everything in assets/ into the APK -- so the
// old builds would keep paying for Protons nothing references.
//
// The tarball is too large for a single git object, so it is uploaded to a GitHub release split
// into fixed-size parts and reassembled here, the same way imagefs.txz is. The prefix
// (proton-10.0-4-x86_64_container_pattern.tzst) is small enough to be committed to the repo, so it
// is deliberately absent from this task.
tasks.register("downloadProton") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File proton = new File(assetDir, "proton-10.0-4-x86_64.txz")
    String protonBaseURL = "https://github.com/Innersargento/Winlator-Ludashi/releases/download/proton-10.0-4-x86_64"
    String protonSHA256Sum = protonBaseURL + "/proton-10.0-4-x86_64.txz.sha256sum"
    int parts = 2

    def assemble = {
        FileOutputStream outputStream = new FileOutputStream(proton)
        for (int i = 0; i < parts; i++) {
            File partFile = new File(assetDir, String.format("proton-10.0-4-x86_64.txz.%02d", i))
            String partURL = String.format("%s/proton-10.0-4-x86_64.txz.%02d", protonBaseURL, i)
            new URL(partURL).withInputStream { p ->
                partFile.withOutputStream { it << p }
                outputStream << partFile.bytes
            }
            partFile.delete()
        }
        outputStream.close()
    }

    doLast {
        if (!proton.exists()) {
            println("Proton 10.0-4 x86_64 was not present, downloading...\n")
            assemble()
        }

        String remoteChecksum
        try {
            remoteChecksum = new URL(protonSHA256Sum).text.split("\\s+")[0].trim()
        }
        catch (IOException e) {
            // The release may not be published yet, or the machine may be offline. A local copy is
            // enough to build, so only turn this into a hard failure when there is nothing to fall
            // back on.
            if (proton.exists()) {
                println("Proton 10.0-4 x86_64: could not reach ${protonSHA256Sum} (${e.message}), using the local copy in assets/.\n")
                return
            }
            throw new GradleException(
                "assets/proton-10.0-4-x86_64.txz is missing and ${protonSHA256Sum} is unreachable (${e.message}).\n" +
                "Publish the release, fix protonBaseURL in app/build.gradle, or copy the tarball into assets/ by hand.")
        }

        byte[] data = Files.readAllBytes(proton.toPath())
        byte[] hash = MessageDigest.getInstance("SHA-256").digest(data)
        String localChecksum = String.format("%064x", new BigInteger(1, hash))

        if (remoteChecksum != localChecksum) {
            println("The version of Proton 10.0-4 x86_64 present locally is older than remote or hasn't been downloaded properly, redownloading...\n")
            assemble()
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
downloadProton.dependsOn(downloadImageFS)
preBuild.dependsOn(downloadProton)

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 28
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 20
        versionName "7.1.4x-cmod"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        // If you have a release build type, add it here
    }


    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Winlator’s dependencies
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.activity:activity-ktx:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.4.0'
    implementation files('libs/MidiSynth/MidiSynth.jar')
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'org.openjsse:openjsse:1.1.7'
    implementation 'androidx.core:core:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
}



